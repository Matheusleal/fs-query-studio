<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:" />
    <style>
      html, body, #editor { height: 100%; margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script src="vs/loader.js"></script>
    <script>
      // Host <-> Monaco bridge — see Section 6. Envelopes match
      // FSharpQueryStudio.Protocol.EditorEnvelope: { id, kind, payload }.
      // WebView2's native channel (window.chrome.webview) is what
      // Avalonia's WebView control proxies on Windows.
      function postToHost(kind, payload) {
        postToHostWithId(crypto.randomUUID(), kind, payload);
      }

      function postToHostWithId(id, kind, payload) {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(JSON.stringify({ id: id, kind: kind, payload: payload }));
        }
      }

      // Pending `provideHover` promises, keyed by the hoverRequested
      // envelope's own id — HoverResolved echoes that same id back
      // (Protocol.HostNotification.HoverResolved), which is how a
      // response is matched to the request that triggered it.
      var pendingHoverResolvers = {};

      // Pending `provideDefinition` promises, keyed by the
      // goToDefinitionRequested envelope's own id, same correlation
      // scheme as `pendingHoverResolvers` above. Each entry also carries
      // the Monaco `model` the request was made against, needed to build
      // the resolved `Location` (its `uri`) once the response lands.
      var pendingDefinitionResolvers = {};

      // Pending `provideSignatureHelp` promises, keyed by the
      // signatureHelpRequested envelope's own id, same correlation scheme
      // as `pendingHoverResolvers` above.
      var pendingSignatureHelpResolvers = {};

      // Pending `provideCompletionItems` promises, keyed by the
      // completionRequested envelope's own id, same correlation scheme
      // as `pendingHoverResolvers` above. Each entry also carries the
      // Monaco `position` the request was made against, needed to build
      // each suggestion's insertion `range` once the response lands.
      var pendingCompletionResolvers = {};

      // Pending `provideRenameEdits` promises, keyed by the
      // renameRequested envelope's own id, same correlation scheme as
      // `pendingHoverResolvers` above.
      var pendingRenameResolvers = {};

      // Settles and clears every pending request across all five maps.
      // Used when the document underneath them changes identity, where
      // any still-outstanding response has become meaningless. Each
      // promise is resolved with that provider's own "nothing found"
      // shape rather than left dangling - an unsettled Monaco provider
      // promise hangs its UI (a spinning hover, a stuck rename) forever,
      // and the map entry leaks.
      function settlePending() {
        Object.keys(pendingHoverResolvers).forEach(function (id) {
          var resolve = pendingHoverResolvers[id];
          delete pendingHoverResolvers[id];
          resolve(null);
        });

        Object.keys(pendingDefinitionResolvers).forEach(function (id) {
          var pending = pendingDefinitionResolvers[id];
          delete pendingDefinitionResolvers[id];
          pending.resolve(null);
        });

        Object.keys(pendingSignatureHelpResolvers).forEach(function (id) {
          var resolve = pendingSignatureHelpResolvers[id];
          delete pendingSignatureHelpResolvers[id];
          resolve(null);
        });

        Object.keys(pendingCompletionResolvers).forEach(function (id) {
          var pending = pendingCompletionResolvers[id];
          delete pendingCompletionResolvers[id];
          pending.resolve({ suggestions: [] });
        });

        Object.keys(pendingRenameResolvers).forEach(function (id) {
          var pending = pendingRenameResolvers[id];
          delete pendingRenameResolvers[id];
          pending.resolve({ edits: [], rejectReason: "The document changed before the rename resolved" });
        });
      }

      require.config({ paths: { vs: "vs" } });

      // Monaco ships no built-in F# language (unlike TypeScript/JS/Python,
      // it's not one of vs/basic-languages) — this is a hand-written
      // Monarch tokenizer, F#'s real lexical grammar, not a generic
      // keyword-soup approximation. Declared before `require()` below so
      // it's available the moment the language is registered.
      var fsharpLanguageConfiguration = {
        comments: { lineComment: "//", blockComment: ["(*", "*)"] },
        brackets: [
          ["{", "}"],
          ["[", "]"],
          ["(", ")"],
          ["[<", ">]"]
        ],
        autoClosingPairs: [
          { open: "{", close: "}" },
          { open: "[", close: "]" },
          { open: "(", close: ")" },
          { open: "\"", close: "\"", notIn: ["string", "comment"] },
          { open: "'", close: "'", notIn: ["string", "comment"] },
          { open: "(*", close: "*)" }
        ],
        surroundingPairs: [
          { open: "{", close: "}" },
          { open: "[", close: "]" },
          { open: "(", close: ")" },
          { open: "\"", close: "\"" },
          { open: "'", close: "'" }
        ]
      };

      var fsharpMonarchLanguage = {
        defaultToken: "",
        tokenPostfix: ".fs",

        // Every one of these is a real F# reserved word (the "keywords in
        // use" table, not the "reserved for future use" one) - a partial
        // list would be a partial highlight.
        keywords: [
          "abstract", "and", "as", "assert", "base", "begin", "class", "default",
          "delegate", "do", "done", "downcast", "downto", "elif", "else", "end",
          "exception", "extern", "false", "finally", "for", "fun", "function",
          "global", "if", "in", "inherit", "inline", "interface", "internal",
          "lazy", "let", "match", "member", "module", "mutable", "namespace",
          "new", "not", "null", "of", "open", "or", "override", "private",
          "public", "rec", "return", "sig", "static", "struct", "then", "to",
          "true", "try", "type", "upcast", "use", "val", "void", "when",
          "while", "with", "yield", "async", "atomic", "break", "checked",
          "component", "const", "constraint", "constructor", "continue",
          "eager", "event", "external", "fixed", "functor", "include", "method",
          "mixin", "object", "parallel", "process", "protected", "pure",
          "sealed", "tailcall", "trait", "virtual", "volatile"
        ],

        // Monarch's `@brackets` token action (used by the root state's
        // generic bracket rule, below) looks the matched text up in this
        // array — a separate thing from `fsharpLanguageConfiguration
        // .brackets` above, which only drives editor bracket-matching/
        // auto-close, not tokenizer coloring. Missing this means every
        // {}/[]/() in the file falls through with no color and no
        // bracket-depth tracking at all.
        brackets: [
          { open: "{", close: "}", token: "delimiter.curly" },
          { open: "[", close: "]", token: "delimiter.square" },
          { open: "(", close: ")", token: "delimiter.parenthesis" }
        ],

        operators: [
          "|>", "<|", ">>", "<<", "->", "<-", "<->", "::", "@", "..", "...",
          "|", "&&", "||", "&", "=", "==", "<>", "<=", ">=", "<", ">", "+",
          "-", "*", "/", "%", "**", "^", "~", "!", ":=", ":>", ":?>", ":?",
          ":", ";", ";;", "?", "?.", "|]", "[|"
        ],

        symbols: /[=><!~?:&|+\-*\/\^%@.]+/,
        escapes: /\\(?:[abfnrtv\\"'0]|x[0-9A-Fa-f]{2}|u[0-9A-Fa-f]{4}|U[0-9A-Fa-f]{8})/,

        tokenizer: {
          root: [
            // Attributes - [<Literal>], [<AutoOpen>], ... - checked before
            // the generic bracket rule so they get their own token class.
            [/\[<(?!\s*>\])/, { token: "annotation.punctuation", next: "@attribute" }],

            // Compiler directives - #r, #load, #if, #light, #time, #I, ...
            [/^\s*#\w+/, "keyword.directive"],

            // Triple-quoted strings before the single-quote char-literal
            // rule, and before plain double-quoted strings - longest match
            // must win here or `"""` would tokenize as an empty string
            // immediately followed by a stray quote.
            [/"""/, { token: "string.quote", next: "@stringTriple" }],
            // Verbatim strings: @"..." - only "" is an escape (a literal
            // embedded quote), backslashes are not special at all.
            [/@"/, { token: "string.quote", next: "@stringVerbatim" }],
            // Interpolated strings: $"...{expr}..." - highlighted as a
            // string overall, with each {...} splice picked out separately
            // so an interpolated expression doesn't just disappear into the
            // surrounding string color.
            [/\$"/, { token: "string.quote", next: "@stringInterpolated" }],
            [/"/, { token: "string.quote", next: "@string" }],

            // Char literal: 'a', '\n', '\uXXXX' - distinct from a generic
            // identifier's trailing prime (`x'`, `list'`), which the
            // identifier rule below handles instead.
            [/'(?:[^'\\]|\\.)'/, "string.char"],

            // Line and block comments - block comments nest, matching real
            // F# semantics (a (* (* ... *) ... *) doesn't close on the
            // first *)).
            [/\/\/.*$/, "comment"],
            [/\(\*/, { token: "comment", next: "@comment" }],

            // Numbers - hex/octal/binary, decimal/float (with optional
            // exponent), and every real F# numeric-literal type suffix
            // (uy/y/us/s/u/l/UL/L/f/F/m/M/I/Q/R/Z/N/G), longest-suffix
            // first so e.g. "UL" doesn't match as "U" and leave a stray "L".
            [/0[xX][0-9a-fA-F]+(?:UL|LF|UY|Y|US|S|UL|L|U)?/, "number.hex"],
            [/0[oO][0-7]+(?:UL|LF|UY|Y|US|S|UL|L|U)?/, "number.octal"],
            [/0[bB][01]+(?:UL|LF|UY|Y|US|S|UL|L|U)?/, "number.binary"],
            [/\d+\.\d+(?:[eE][+-]?\d+)?[fFmM]?/, "number.float"],
            [/\d+[eE][+-]?\d+[fFmM]?/, "number.float"],
            [/\d+(?:UL|LF|UY|Y|US|S|UL|L|U|I|Q|R|Z|N|G|F|M|y|s|u)?/, "number"],

            // Bang-suffixed keywords (let!, use!, do!, yield!, return!,
            // match!) before the generic identifier rule, which would
            // otherwise swallow the letters and leave a stray "!" behind.
            [/\b(?:let|use|do|yield|return|match)!/, "keyword"],

            // Identifiers - PascalCase reads as a type/module name (F#'s
            // own convention: types, modules, and constructors are always
            // capitalized), everything else falls through the keyword
            // table or is a plain identifier. Trailing "'" is legal
            // (`x'`, `acc'`) and included directly in the pattern.
            [
              /[a-z_][a-zA-Z0-9_']*/,
              { cases: { "@keywords": "keyword", "@default": "identifier" } }
            ],
            [/[A-Z][a-zA-Z0-9_']*/, "type.identifier"],

            [/[{}()\[\]]/, "@brackets"],

            [/@symbols/, { cases: { "@operators": "operator", "@default": "" } }],

            [/[;,]/, "delimiter"],
            [/\s+/, ""]
          ],

          // [<...>] attribute body - back to root once the closing ">]" is
          // seen, so whatever the attribute *contains* (an expression, in
          // general) still tokenizes normally rather than as one opaque
          // annotation blob.
          attribute: [[/>\]/, { token: "annotation.punctuation", next: "@pop" }], { include: "root" }],

          string: [
            [/[^\\"]+/, "string"],
            [/@escapes/, "string.escape"],
            [/\\./, "string.escape.invalid"],
            [/"/, { token: "string.quote", next: "@pop" }]
          ],

          stringTriple: [
            [/[^"]+/, "string"],
            [/"""/, { token: "string.quote", next: "@pop" }],
            [/"/, "string"]
          ],

          stringVerbatim: [
            [/[^"]+/, "string"],
            [/""/, "string.escape"],
            [/"/, { token: "string.quote", next: "@pop" }]
          ],

          stringInterpolated: [
            [/\{\{/, "string"],
            [/\}\}/, "string"],
            [/\{/, { token: "delimiter.bracket", next: "@interpolation" }],
            [/[^\\"{}]+/, "string"],
            [/@escapes/, "string.escape"],
            [/\\./, "string.escape.invalid"],
            [/"/, { token: "string.quote", next: "@pop" }]
          ],

          // A splice inside an interpolated string - re-enters the normal
          // tokenizer rules for whatever expression is inside {...} (so a
          // spliced identifier/number/string still colors correctly),
          // tracking its own bracket depth so a splice containing a
          // record/list literal's own {}/[] doesn't close the splice early.
          interpolation: [
            [/\{/, { token: "delimiter.bracket", next: "@push" }],
            [/\}/, { token: "delimiter.bracket", next: "@pop" }],
            { include: "root" }
          ],

          comment: [
            [/[^(*]+/, "comment"],
            [/\(\*/, { token: "comment", next: "@push" }],
            [/\*\)/, { token: "comment", next: "@pop" }],
            [/[(*]/, "comment"]
          ]
        }
      };

      require(["vs/editor/editor.main"], function () {
        monaco.languages.register({ id: "fsharp" });
        monaco.languages.setLanguageConfiguration("fsharp", fsharpLanguageConfiguration);
        monaco.languages.setMonarchTokensProvider("fsharp", fsharpMonarchLanguage);

        // Set synchronously from the host's own Uri (?theme=vs-dark/vs)
        // rather than waiting for a themeChanged message: the message
        // channel isn't guaranteed to be ready this early (see
        // documentLoaded's own doc comment on `MainWindow`'s host side),
        // but this URL query string is available immediately, no race.
        var initialTheme = new URLSearchParams(location.search).get("theme") || "vs-dark";

        var editor = monaco.editor.create(document.getElementById("editor"), {
          value: "",
          language: "fsharp",
          automaticLayout: true,
          theme: initialTheme
        });

        var documentUri = "untitled:Script1.fsx";
        var currentVersion = 0;
        var suppressChangeEvent = false;

        // The column every symbol-lookup request has to send. Monaco hands
        // a provider the raw caret/mouse position, which for a hover lands
        // wherever the pointer happened to stop inside the glyph run and
        // for F2/F12 wherever the caret already was — but the whole
        // Analysis layer (Hover, GoToDefinition, SignatureHelp, Rename)
        // requires the column at or *after* the end of the identifier,
        // because that is what FCS's GetSymbolUseAtLocation resolves
        // against. Sending the raw caret means GetSymbolUseAtLocation
        // returns None and the feature silently does nothing.
        // getWordAtPosition supplies the identifier's real end column; the
        // caret is the fallback when the position isn't inside a word at
        // all (whitespace, punctuation), where there is nothing to resolve
        // anyway. The trailing -1 converts Monaco's 1-based column to the
        // wire's 0-based one.
        function fcsColumnAt(model, position) {
          var word = model.getWordAtPosition(position);
          return (word ? word.endColumn : position.column) - 1;
        }

        editor.onDidChangeModelContent(function () {
          if (suppressChangeEvent) {
            return;
          }
          currentVersion += 1;
          postToHost("textChanged", {
            documentUri: documentUri,
            version: currentVersion,
            source: editor.getValue()
          });
        });

        monaco.languages.registerHoverProvider("fsharp", {
          provideHover: function (model, position) {
            return new Promise(function (resolve) {
              var id = crypto.randomUUID();
              pendingHoverResolvers[id] = resolve;

              // Monaco positions are 1-based; the host/FCS side is
              // 0-based on the column (Diagnostic's own convention -
              // see DiagnosticsUpdated below) and 1-based on the line
              // to match FCS's own native line numbering directly.
              postToHostWithId(id, "hoverRequested", {
                documentUri: documentUri,
                version: currentVersion,
                line: position.lineNumber,
                column: fcsColumnAt(model, position)
              });
            });
          }
        });

        monaco.languages.registerDefinitionProvider("fsharp", {
          provideDefinition: function (model, position) {
            return new Promise(function (resolve) {
              var id = crypto.randomUUID();
              pendingDefinitionResolvers[id] = { resolve: resolve, model: model };

              postToHostWithId(id, "goToDefinitionRequested", {
                documentUri: documentUri,
                version: currentVersion,
                line: position.lineNumber,
                column: fcsColumnAt(model, position)
              });
            });
          }
        });

        monaco.languages.registerSignatureHelpProvider("fsharp", {
          // "," is kept as a trigger character alongside "(" so the popup
          // re-triggers as the caret moves on to the next argument. The
          // backend has no active-parameter tracking, so even a successful
          // lookup always highlights the first parameter — a known,
          // deliberately out-of-scope limitation — see docs/DEVLOG.md.
          signatureHelpTriggerCharacters: ["(", ","],
          provideSignatureHelp: function (model, position) {
            return new Promise(function (resolve) {
              var id = crypto.randomUUID();
              pendingSignatureHelpResolvers[id] = resolve;

              postToHostWithId(id, "signatureHelpRequested", {
                documentUri: documentUri,
                version: currentVersion,
                line: position.lineNumber,
                // FSAC's textDocument/signatureHelp (unlike the old
                // FCS-direct backend this provider originally targeted)
                // needs a position genuinely *inside* the call's
                // argument-list token span — not the end column of the
                // callee's own name. Confirmed by Worker.Tests'
                // "resolves only from inside a call's argument list, not
                // merely at the callee's own name" test: the identical
                // request sent at the callee-name-end column gets `null`
                // back from real fsautocomplete, while a position inside
                // the argument list (e.g. on the first argument itself)
                // resolves. This provider used to scan backward over the
                // line for "name(" and send the end of that name instead
                // of the real caret (a leftover of the old click-on-the-
                // identifier convention) — that made every real signature-
                // help request land exactly on the position FSAC now
                // returns null for, so the hint widget never appeared.
                // Sending the caret's own raw column (0-based, matching
                // every other wire position) is what Monaco is already
                // tracking when this provider fires.
                column: position.column - 1
              });
            });
          }
        });

        monaco.languages.registerCompletionItemProvider("fsharp", {
          // Without this Monaco only invokes the provider on word
          // characters, so a bare "s." never popped the member list until
          // another character was typed.
          triggerCharacters: ["."],
          provideCompletionItems: function (model, position) {
            // The already-typed partial word at the cursor (e.g. "myLoc"
            // of "myLocalValue") — without this, every accepted
            // suggestion inserts at the bare cursor point instead of
            // replacing what's already there, doubling the typed prefix
            // (accepting "myLocalValue" after typing "myLoc" would
            // produce "myLocmyLocalValue").
            var word = model.getWordUntilPosition(position);
            var wordRange = {
              startLineNumber: position.lineNumber,
              endLineNumber: position.lineNumber,
              startColumn: word.startColumn,
              endColumn: word.endColumn
            };

            return new Promise(function (resolve) {
              var id = crypto.randomUUID();
              pendingCompletionResolvers[id] = { resolve: resolve, range: wordRange };

              // Deliberately the raw caret, *not* fcsColumnAt: completion
              // asks "what could follow what I have typed so far", so the
              // wanted column is the end of the typed prefix, which is
              // exactly where the caret already is. fcsColumnAt would snap
              // forward to the end of the whole word under the caret,
              // which is a different question. Verified empirically
              // against the worker (see HandlersTests' dotted-completion
              // tests) rather than assumed.
              postToHostWithId(id, "completionRequested", {
                documentUri: documentUri,
                version: currentVersion,
                line: position.lineNumber,
                column: position.column - 1
              });
            });
          }
        });

        monaco.languages.registerRenameProvider("fsharp", {
          provideRenameEdits: function (model, position, newName) {
            return new Promise(function (resolve) {
              var id = crypto.randomUUID();
              pendingRenameResolvers[id] = { resolve: resolve, model: model };

              postToHostWithId(id, "renameRequested", {
                documentUri: documentUri,
                version: currentVersion,
                line: position.lineNumber,
                column: fcsColumnAt(model, position),
                newName: newName
              });
            });
          }
        });

        // FCS's DiagnosticSeverity -> Monaco's MarkerSeverity. Matched
        // case-insensitively since the exact casing the F#-side union
        // encoding puts on the wire isn't pinned down by an automated
        // test (this whole path is manual-verify-only — see below).
        function severityToMonacoMarkerSeverity(severity) {
          switch (String(severity).toLowerCase()) {
            case "error":
              return monaco.MarkerSeverity.Error;
            case "warning":
              return monaco.MarkerSeverity.Warning;
            default:
              return monaco.MarkerSeverity.Info;
          }
        }

        // HoverInfo -> Monaco's `contents` (an array of markdown-ish
        // value objects). One line per field that's actually present -
        // Signature/XmlDoc are optional per Section 8.
        function hoverInfoToContents(hover) {
          var lines = [hover.displayName + ": " + hover.type];
          if (hover.signature) {
            lines.push("```fsharp\n" + hover.signature + "\n```");
          }
          if (hover.xmlDoc) {
            lines.push(hover.xmlDoc);
          }
          return lines.map(function (value) {
            return { value: value };
          });
        }

        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.addEventListener("message", function (event) {
            var envelope = typeof event.data === "string" ? JSON.parse(event.data) : event.data;

            // Host -> editor messages (completions, navigation, themes,
            // execution state) are wired as each lands in its own later
            // task. An unrecognized kind is ignored, not thrown — a
            // malformed/future message must never crash the page.
            switch (envelope.kind) {
              case "caretMoved": {
                var caretPosition = {
                  lineNumber: envelope.payload.line + 1,
                  column: envelope.payload.column + 1
                };
                editor.setPosition(caretPosition);
                editor.revealPositionInCenter(caretPosition);
                editor.focus();
                break;
              }
              case "hoverResolved": {
                var resolve = pendingHoverResolvers[envelope.id];

                if (resolve) {
                  delete pendingHoverResolvers[envelope.id];
                  var hover = envelope.payload.hover;
                  resolve(hover ? { contents: hoverInfoToContents(hover) } : null);
                }

                break;
              }
              case "definitionResolved": {
                var pending = pendingDefinitionResolvers[envelope.id];

                if (pending) {
                  delete pendingDefinitionResolvers[envelope.id];
                  var location = envelope.payload.location;

                  // Cross-file jumps (a resolved declaration outside the
                  // one open document/model) aren't supported yet - this
                  // editor hosts exactly one model at a time, with no
                  // multi-file project view for Monaco to jump into. Same
                  // documentUri is the only case that can resolve to
                  // anything real; anything else resolves null (Monaco
                  // treats that as "no definition found", not an error).
                  // The worker normalises a same-file declaration's
                  // filePath back to the requesting documentUri before
                  // sending it, so this comparison is against a value that
                  // can actually match - it used to be compared against
                  // the analysis context's throwaway temp script path,
                  // which differed on every request and never matched.
                  if (location && location.filePath === documentUri) {
                    pending.resolve({
                      uri: pending.model.uri,
                      range: {
                        startLineNumber: location.startLine + 1,
                        startColumn: location.startColumn + 1,
                        endLineNumber: location.endLine + 1,
                        endColumn: location.endColumn + 1
                      }
                    });
                  } else {
                    pending.resolve(null);
                  }
                }

                break;
              }
              case "signatureHelpResolved": {
                var resolveSig = pendingSignatureHelpResolvers[envelope.id];

                if (resolveSig) {
                  delete pendingSignatureHelpResolvers[envelope.id];
                  var help = envelope.payload.signatureHelp;

                  if (help) {
                    resolveSig({
                      value: {
                        signatures: [
                          {
                            label: help.displayName + "(" + help.parameters.join(", ") + "): " + help.returnType,
                            parameters: help.parameters.map(function (p) { return { label: p }; })
                          }
                        ],
                        activeSignature: 0,
                        activeParameter: 0
                      },
                      dispose: function () {}
                    });
                  } else {
                    resolveSig(null);
                  }
                }

                break;
              }
              case "completionResolved": {
                var pendingCompletion = pendingCompletionResolvers[envelope.id];

                if (pendingCompletion) {
                  delete pendingCompletionResolvers[envelope.id];

                  var suggestions = envelope.payload.items.map(function (name) {
                    return {
                      label: name,
                      kind: monaco.languages.CompletionItemKind.Text,
                      insertText: name,
                      range: pendingCompletion.range
                    };
                  });

                  pendingCompletion.resolve({ suggestions: suggestions });
                }

                break;
              }
              case "renameResolved": {
                var pendingRename = pendingRenameResolvers[envelope.id];

                if (pendingRename) {
                  delete pendingRenameResolvers[envelope.id];
                  var edits = envelope.payload.edits;

                  if (edits) {
                    pendingRename.resolve({
                      edits: edits.map(function (e) {
                        return {
                          resource: pendingRename.model.uri,
                          textEdit: {
                            range: {
                              startLineNumber: e.startLine + 1,
                              startColumn: e.startColumn + 1,
                              endLineNumber: e.endLine + 1,
                              endColumn: e.endColumn + 1
                            },
                            text: envelope.payload.newName
                          }
                        };
                      })
                    });
                  } else {
                    // rejectReason surfaces a message in the rename
                    // widget; without it Monaco just closes silently and
                    // the user can't tell a failed lookup from a rename
                    // that genuinely changed nothing.
                    pendingRename.resolve({
                      edits: [],
                      rejectReason: "No symbol found to rename at this position"
                    });
                  }
                }

                break;
              }
              case "diagnosticsUpdated": {
                var payload = envelope.payload;
                var model = editor.getModel();

                if (model) {
                  // Diagnostic positions are 0-based (Section 8); Monaco's
                  // marker API is 1-based on both line and column.
                  var markers = payload.diagnostics.map(function (d) {
                    return {
                      severity: severityToMonacoMarkerSeverity(d.severity),
                      message: d.message,
                      startLineNumber: d.startLine + 1,
                      startColumn: d.startColumn + 1,
                      endLineNumber: d.endLine + 1,
                      endColumn: d.endColumn + 1,
                      code: d.code || undefined
                    };
                  });

                  monaco.editor.setModelMarkers(model, "fsharp", markers);
                }

                break;
              }
              case "documentLoaded": {
                // Settle and drop every in-flight request first. setValue
                // mutates the one shared model in place, so a response for
                // the *previous* document that lands after this point
                // would otherwise be applied against the new document's
                // text - resolving a hover, a jump target, or worse a
                // rename edit at coordinates that mean something else now.
                // Each is settled with its own "nothing found" value
                // rather than abandoned, so no Monaco promise hangs.
                settlePending();

                suppressChangeEvent = true;
                documentUri = envelope.payload.documentUri;
                currentVersion = envelope.payload.version;
                editor.setValue(envelope.payload.text);
                suppressChangeEvent = false;
                break;
              }
              case "themeChanged": {
                monaco.editor.setTheme(envelope.payload.theme);
                break;
              }
              default:
                break;
            }
          });
        }

        // Tell the host this message listener is now attached and Monaco
        // is ready for a documentLoaded push - the host waits for this
        // instead of pushing at construction time or on
        // NavigationCompleted, both of which can fire before this
        // require() callback (and therefore the listener above) has run.
        postToHost("editorReady", {});
      });
    </script>
  </body>
</html>
