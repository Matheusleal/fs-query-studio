name: vscode-extension

on:
  push:
    branches: [main, main-vscode]
    paths:
      - "editors/vscode/**"
      - "src/FSharpQueryStudio.Worker/**"
      - "src/FSharpQueryStudio.Protocol/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - "src/**"
      - ".github/workflows/vscode-extension.yml"

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish worker
        run: >
          dotnet publish src/FSharpQueryStudio.Worker/FSharpQueryStudio.Worker.fsproj
          -c Release -o editors/vscode/dist/worker

      - name: Install extension deps
        working-directory: editors/vscode
        run: npm ci

      - name: Compile
        working-directory: editors/vscode
        run: npm run compile

      - name: Test (unit)
        working-directory: editors/vscode
        run: npm test

      - name: Compile integration specs
        working-directory: editors/vscode
        run: npm run pretest:vscode

      - name: Test (VS Code extension host, Linux)
        if: runner.os == 'Linux'
        working-directory: editors/vscode
        run: xvfb-run -a npm run test:vscode

      - name: Test (VS Code extension host, non-Linux)
        if: runner.os != 'Linux'
        working-directory: editors/vscode
        run: npm run test:vscode

      - name: Package VSIX
        if: matrix.os == 'ubuntu-latest'
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          out="$(npx --yes @vscode/vsce package --out fs-query-studio.vsix 2>&1)"
          echo "$out"
          if grep -q 'WARNING' <<<"$out"; then
            echo "::error::vsce package emitted warnings"; exit 1
          fi

      - name: Assert VSIX contents
        if: matrix.os == 'ubuntu-latest'
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          listing="$(npx --yes @vscode/vsce ls)"
          echo "$listing"
          fail=0
          for required in package.json README.md LICENSE dist/extension.js dist/worker/FSharpQueryStudio.Worker.dll media/renderer/index.js; do
            if ! grep -qxF "$required" <<<"$listing"; then
              echo "::error::VSIX is missing required file: $required"; fail=1
            fi
          done
          for forbidden in 'src/' 'test/' 'out/' 'node_modules/'; do
            if grep -q "$forbidden" <<<"$listing"; then
              echo "::error::VSIX contains files under $forbidden"; fail=1
            fi
          done
          if grep -qE '\.test\.ts$|tsconfig.*\.json$' <<<"$listing"; then
            echo "::error::VSIX contains test or tsconfig files"; fail=1
          fi
          exit $fail

      - name: Upload VSIX
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fs-query-studio-vsix
          path: editors/vscode/fs-query-studio.vsix
