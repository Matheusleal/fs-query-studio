name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore FSharpQueryStudio.slnx

      - run: dotnet build FSharpQueryStudio.slnx --no-restore --configuration Release

      # SQL Server/PostgreSQL connector tests use Testcontainers, which
      # needs Linux Docker containers - not reliably available on
      # GitHub-hosted Windows runners. Excluded here and run on the Linux
      # job / locally instead - this filter is an escape hatch, not a way
      # to skip everything else.
      - run: dotnet test FSharpQueryStudio.slnx --no-build --configuration Release --filter "Category!=RequiresDocker" --settings .runsettings --blame-hang --blame-hang-timeout 45s --logger "console;verbosity=normal"

  build-and-test-linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Runs the reused libraries + the F# worker on Linux, each project
    # individually so one failure doesn't mask the others. The VS Code
    # extension itself is built and tested cross-OS in vscode-extension.yml.
    # Docker-backed SQL Server / PostgreSQL tests are NOT excluded here:
    # ubuntu-latest has native Linux container support.
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/FSharpQueryStudio.Protocol.Tests/FSharpQueryStudio.Protocol.Tests.fsproj
          - tests/FSharpQueryStudio.Fsac.Tests/FSharpQueryStudio.Fsac.Tests.fsproj
          - tests/FSharpQueryStudio.Execution.Tests/FSharpQueryStudio.Execution.Tests.fsproj
          - tests/FSharpQueryStudio.Results.Tests/FSharpQueryStudio.Results.Tests.fsproj
          - tests/FSharpQueryStudio.Connectors.Tests/FSharpQueryStudio.Connectors.Tests.fsproj
          - tests/FSharpQueryStudio.Storage.Tests/FSharpQueryStudio.Storage.Tests.fsproj
          - tests/FSharpQueryStudio.Security.Tests/FSharpQueryStudio.Security.Tests.fsproj
          - tests/FSharpQueryStudio.Worker.Tests/FSharpQueryStudio.Worker.Tests.fsproj
          - tests/FSharpQueryStudio.Integration.Tests/FSharpQueryStudio.Integration.Tests.fsproj

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet test "${{ matrix.project }}" --configuration Release --settings .runsettings --blame-hang --blame-hang-timeout 45s --logger "console;verbosity=normal"
