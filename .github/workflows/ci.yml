name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore FSharpQueryStudio.slnx

      - run: dotnet build FSharpQueryStudio.slnx --no-restore --configuration Release

      # SQL Server/PostgreSQL connector tests use Testcontainers, which
      # needs Linux Docker containers - not reliably available on
      # GitHub-hosted Windows runners. RequiresPublish (D.7) does a full
      # self-contained publish and a real windowed launch, too heavy to
      # run on every push. Both are excluded here and run locally
      # instead - this filter is an escape hatch, not a way to skip
      # everything else.
      - run: dotnet test FSharpQueryStudio.slnx --no-build --configuration Release --filter "Category!=RequiresDocker&Category!=RequiresPublish"
