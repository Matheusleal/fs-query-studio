name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  format-check:
    name: Check F# Code Formatting (Fantomas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet tool restore

      - run: dotnet fantomas src tests build.fsx --check

  build-and-test:
    name: Test Windows (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Protocol
            project: tests/FSharpQueryStudio.Protocol.Tests/FSharpQueryStudio.Protocol.Tests.fsproj
          - name: Fsac
            project: tests/FSharpQueryStudio.Fsac.Tests/FSharpQueryStudio.Fsac.Tests.fsproj
          - name: Execution
            project: tests/FSharpQueryStudio.Execution.Tests/FSharpQueryStudio.Execution.Tests.fsproj
          - name: Results
            project: tests/FSharpQueryStudio.Results.Tests/FSharpQueryStudio.Results.Tests.fsproj
          - name: Connectors
            project: tests/FSharpQueryStudio.Connectors.Tests/FSharpQueryStudio.Connectors.Tests.fsproj
          - name: Storage
            project: tests/FSharpQueryStudio.Storage.Tests/FSharpQueryStudio.Storage.Tests.fsproj
          - name: Security
            project: tests/FSharpQueryStudio.Security.Tests/FSharpQueryStudio.Security.Tests.fsproj
          - name: Worker
            project: tests/FSharpQueryStudio.Worker.Tests/FSharpQueryStudio.Worker.Tests.fsproj
          - name: Integration
            project: tests/FSharpQueryStudio.Integration.Tests/FSharpQueryStudio.Integration.Tests.fsproj

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # SQL Server/PostgreSQL connector tests use Testcontainers, which
      # needs Linux Docker containers - not reliably available on
      # GitHub-hosted Windows runners. Excluded here and run on the Linux
      # job / locally instead - this filter is an escape hatch, not a way
      # to skip everything else.
      - run: dotnet test "${{ matrix.project }}" --configuration Release --filter "Category!=RequiresDocker" --settings .runsettings --blame-hang --blame-hang-timeout 20m --logger "console;verbosity=normal"

  build-and-test-linux:
    name: Test Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Runs the reused libraries + the F# worker on Linux, each project
    # individually so one failure doesn't mask the others. The VS Code
    # extension itself is built and tested cross-OS in vscode-extension.yml.
    # Docker-backed SQL Server / PostgreSQL tests are NOT excluded here:
    # ubuntu-latest has native Linux container support.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Protocol
            project: tests/FSharpQueryStudio.Protocol.Tests/FSharpQueryStudio.Protocol.Tests.fsproj
          - name: Fsac
            project: tests/FSharpQueryStudio.Fsac.Tests/FSharpQueryStudio.Fsac.Tests.fsproj
          - name: Execution
            project: tests/FSharpQueryStudio.Execution.Tests/FSharpQueryStudio.Execution.Tests.fsproj
          - name: Results
            project: tests/FSharpQueryStudio.Results.Tests/FSharpQueryStudio.Results.Tests.fsproj
          - name: Connectors
            project: tests/FSharpQueryStudio.Connectors.Tests/FSharpQueryStudio.Connectors.Tests.fsproj
          - name: Storage
            project: tests/FSharpQueryStudio.Storage.Tests/FSharpQueryStudio.Storage.Tests.fsproj
          - name: Security
            project: tests/FSharpQueryStudio.Security.Tests/FSharpQueryStudio.Security.Tests.fsproj
          - name: Worker
            project: tests/FSharpQueryStudio.Worker.Tests/FSharpQueryStudio.Worker.Tests.fsproj
          - name: Integration
            project: tests/FSharpQueryStudio.Integration.Tests/FSharpQueryStudio.Integration.Tests.fsproj

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet test "${{ matrix.project }}" --configuration Release --settings .runsettings --blame-hang --blame-hang-timeout 10m --logger "console;verbosity=normal"

  build-and-test-gate:
    name: Build and test (Windows)
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm all Windows test suites passed
        run: echo "All Windows test suites completed successfully."
